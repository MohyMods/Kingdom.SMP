plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.mohymods.kingdomsmp'
version = mod_version
base { archivesName = 'kingdom-smp-core' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { kingdom_smp { sourceSet(sourceSets.main) } }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('test', Test) { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version, neo_version: project.neo_version }
}
