plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.mohymods.kingdomsmp'
version = mod_version
base { archivesName = 'kingdom-smp-core' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.ftb.dev/releases'; content { includeGroup 'dev.ftb.mods' } }
    maven { url = 'https://maven.architectury.dev/'; content { includeGroup 'dev.architectury' } }
}
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest
    mods {
        kingdom_smp { sourceSet(sourceSets.main) }
        kingdom_smp_tests { sourceSet(sourceSets.gameTest) }
    }
    runs {
        client { client(); gameDirectory = file('run-client'); loadedMods = [mods.kingdom_smp] }
        server {
            server(); programArgument '--nogui'; loadedMods = [mods.kingdom_smp]
            gameDirectory = file(providers.gradleProperty('kingdomServerRunDir').getOrElse('run'))
            if (providers.gradleProperty('kingdomTestNamespace').isPresent()) {
                sourceSet = sourceSets.gameTest
                loadedMods = [mods.kingdom_smp, mods.kingdom_smp_tests]
                systemProperty 'neoforge.enableGameTest', 'true'
                systemProperty 'kingdom.testSmithProduction', providers.gradleProperty('kingdomSmithProduction').getOrElse('false')
                systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('kingdomTestNamespace').get()
                // Isolate optional-mod user caches inside this private execution workspace.
                environment 'XDG_CACHE_HOME', file('work/test-user-cache').absolutePath
                environment 'XDG_DATA_HOME', file('work/test-user-data').absolutePath
                systemProperty 'kingdom.testLegacyProfile', (!['kingdom_smp_master_forestry_tests','kingdom_smp_profession_production_tests','kingdom_smp_townhall_tests','kingdom_smp_commerce_tests','kingdom_smp_bank_tests','kingdom_smp_auction_tests','kingdom_smp_market_tests','kingdom_smp_crop_tests','kingdom_smp_profession_tests','kingdom_smp_commission_tests','kingdom_smp_woodland_tests','kingdom_smp_retained_tests','kingdom_smp_tree_tests','kingdom_smp_premises_tests', 'kingdom_smp_farmer_tests','kingdom_smp_farmer_events_tests','kingdom_smp_bounty_tests','kingdom_smp_farmer_gear_tests','kingdom_smp_gear_shop_tests','kingdom_smp_farmer_loop_tests','kingdom_smp_hunt_tests','kingdom_smp_foundation_tests','kingdom_smp_foundation_resume_tests','kingdom_smp_hut_foundation_tests','kingdom_smp_wharf_tests','kingdom_smp_resident_name_tests','kingdom_smp_title_tests','kingdom_smp_scout_tests','kingdom_smp_aircraft_fuel_tests','kingdom_smp_cargo_journey_tests','kingdom_smp_cargo_receipt_tests','kingdom_smp_flight_tests','kingdom_smp_aircraft_repair_tests','kingdom_smp_aircraft_sales_tests','kingdom_smp_aircraft_packet_tests','kingdom_smp_aircraft_restore_tests','kingdom_smp_aircraft_tests','kingdom_smp_waystone_tests','kingdom_smp_quest_tests','kingdom_smp_space_tests','kingdom_smp_travel_tests','kingdom_smp_archive_tests'].contains(providers.gradleProperty('kingdomTestNamespace').get())).toString()
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = file(providers.gradleProperty('kingdomTestRunDir').getOrElse('work/gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('kingdomTestNamespace').getOrElse('kingdom_smp_tests')
            systemProperty 'kingdom.testLegacyProfile', (!['kingdom_smp_master_forestry_tests','kingdom_smp_profession_production_tests','kingdom_smp_townhall_tests','kingdom_smp_commerce_tests','kingdom_smp_bank_tests','kingdom_smp_auction_tests','kingdom_smp_market_tests','kingdom_smp_crop_tests','kingdom_smp_profession_tests','kingdom_smp_commission_tests','kingdom_smp_woodland_tests','kingdom_smp_retained_tests','kingdom_smp_tree_tests','kingdom_smp_premises_tests', 'kingdom_smp_farmer_tests','kingdom_smp_farmer_events_tests','kingdom_smp_bounty_tests','kingdom_smp_farmer_gear_tests','kingdom_smp_gear_shop_tests','kingdom_smp_farmer_loop_tests','kingdom_smp_hunt_tests','kingdom_smp_foundation_tests','kingdom_smp_foundation_resume_tests','kingdom_smp_hut_foundation_tests','kingdom_smp_wharf_tests','kingdom_smp_resident_name_tests','kingdom_smp_title_tests','kingdom_smp_scout_tests','kingdom_smp_aircraft_fuel_tests','kingdom_smp_cargo_journey_tests','kingdom_smp_cargo_receipt_tests','kingdom_smp_flight_tests','kingdom_smp_aircraft_repair_tests','kingdom_smp_aircraft_sales_tests','kingdom_smp_aircraft_packet_tests','kingdom_smp_aircraft_restore_tests','kingdom_smp_aircraft_tests','kingdom_smp_waystone_tests','kingdom_smp_quest_tests','kingdom_smp_space_tests','kingdom_smp_travel_tests','kingdom_smp_archive_tests'].contains(providers.gradleProperty('kingdomTestNamespace').getOrElse('kingdom_smp_tests'))).toString()
            loadedMods = [mods.kingdom_smp, mods.kingdom_smp_tests]
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    unitTest {
        enable()
        testedMod = mods.kingdom_smp
        loadedMods = [mods.kingdom_smp]
    }
}
dependencies {
    // Optional verified adapter APIs: compile only, never shade or force-install third-party mods.
    compileOnly('dev.ftb.mods:ftb-quests-neoforge:2101.1.37') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-library-neoforge:2101.1.39') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-teams-neoforge:2101.1.11') { transitive = false }
    compileOnly('dev.architectury:architectury-neoforge:13.0.11') { transitive = false }

    // Explicit opt-in compatibility fixture; never bundle or silently install third-party mods.
    if (providers.gradleProperty('kingdomClaimTestMods').isPresent()) {
        def claimJars = fileTree(providers.gradleProperty('kingdomClaimTestMods').get()) { include '*.jar' }
        runtimeOnly claimJars
        gameTestRuntimeOnly claimJars
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('runServer', JavaExec) { standardInput = System.in }
def modMetadata = [version: project.version.toString(), neo_version: project.neo_version.toString()]
processResources {
    inputs.properties modMetadata
    filesMatching('META-INF/neoforge.mods.toml') { expand modMetadata }
}
